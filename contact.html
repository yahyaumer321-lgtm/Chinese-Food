<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Food</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
                
*
{
margin: 0;
padding: 0;
}

.food
{
    background-image: url(2148382871.jpg);
    background-size: cover;
    background-position: 5%;
    width: 100%;
    height: 500px;
}

#chinese
 {
    padding-bottom: 9px;
}

.ul
{

   display: flex ;
   align-items: center;
   justify-content: center;
   padding-top: 20px;
}

.ul #li
{
    display: inline-block;
}

.ul #li #a
{
   text-decoration: none;
   color: white;
   font-size: 20px;
   margin-left: 80px;
}

.ul #li #a:hover
{
     color: #cf9c1e;
}

i
{
    color: white;
    margin-left: 28px;
    font-size: 20px;
    font-weight: 800;
    opacity: 0.90;
   
}

i:hover
{
    color: #cf9c1e;
}

.hamburger
{
    display: none;
    position: absolute;
    right: 20px;
    top: 20px;
    cursor: pointer;
}


@media (max-width:768px)
{
    .hamburger
    {
        display: block;
    }

    .ul
    {
        display: none;
        flex-direction: column;
        width: 100%;
        text-align: center;
        background: rgba(0,0,0,0.9);
        padding: 20px 0;
    }

    .ul.active
    {
        display: flex;
    }

    .ul #li
    {
        margin: 15px 0;
    }

    .ul #li #a
    {
        margin-left: 0;
    }

    #chinese
    {
        margin-bottom: 20px;
    }
}


@media (max-width:1024px)
{
    .hamburger
    {
        display: block;
    }

    .hamburger i
    {
        font-size: 50px;
    }

    .ul
    {
        display: none;
        flex-direction: column;
        width: 100%;
        text-align: center;
        background: rgba(0,0,0,0.9);
        padding: 20px 0;
        position: absolute;
        top: 70px;
        left: 0;
    }

    .ul.active
    {
        display: flex;
    }

    .ul #li
    {
        margin: 15px 0;
    }

    .ul #li #a
    {
        margin-left: 0;
    }

    #chinese
    {
        margin-bottom: 20px;
    }

    .fa-magnifying-glass
    {
        margin-top: 15px;
        margin-left: 0;
    }
}



#h1
{
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 50px;
    font-weight: 300;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    padding-top: 170px;
    padding-bottom: 170px;
}

.color
{
    width: 100%;
    height: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #CF9C1E;
    background: linear-gradient(135deg,#CF9C1E 0%,#000000 100%);
    opacity: 0.95;
}

.contact
{
    background-color: white;
    width: 50%;
    height: 700px;
    border-radius: 25px;
}

.contact1
{
    padding: 30px;
}

#p1
{
    padding-top: 15px;
    font-size: 20px;
    font-family: monospace;
    padding-bottom: 5px;
}

#input
{
    width: 100%;
    height: 45px;
    border-radius: 5px;
    border: none;
    background-color: rgba(0, 0, 0, .04);
    font-size: 20px;
}

#p2
{
    padding-top: 30px;
    font-size: 20px;
    font-family: monospace;
    padding-bottom: 5px;
}

#p3
{
    padding-top: 30px;
    font-size: 20px;
    font-family: monospace;
    padding-bottom: 5px;
}

#p4
{
    padding-top: 30px;
    font-size: 20px;
    font-family: monospace;
    padding-bottom: 5px;
}

.input1
{
    width: 100%;
    height: 200px;
    border-radius: 5px;
    border: none;
    background-color: rgba(0, 0, 0, .04);
    font-size: 22px;
}

.button
{
    background-color: #CF9C1E;
    color: white;
    padding: 10px 20px 10px 20px;
    border: none;
    font-size: 20px;
    font-family: arial;
    letter-spacing: -1px;
}

/* =========================
   Laptop
========================= */
@media screen and (max-width: 1440px)
{
    .contact
    {
        width: 60%;
    }

    .ul #li #a
    {
        margin-left: 50px;
    }
}

/* =========================
   Tablet
========================= */
@media screen and (max-width: 1024px)
{
    .food
    {
        background-position: center;
        height: auto;
        min-height: 500px;
    }

    .ul
    {
        flex-direction: column;
        text-align: center;
    }

    .ul #li
    {
        display: block;
        margin: 12px 0;
    }

    .ul #li #a
    {
        margin-left: 0;
        font-size: 22px;
    }

    #chinese
    {
        display: block;
        margin: 0 auto 20px auto;
    }

    i
    {
        margin-left: 0;
        margin-top: 15px;
    }

    #h1
    {
        text-align: center;
        font-size: 40px;
        padding-left: 20px;
        padding-right: 20px;
    }

    .color
    {
        height: auto;
        padding: 50px 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contact
    {
        width: 80%;
        height: auto;
    }

    .contact1
    {
        text-align: center;
    }

    #input,
    .input1
    {
        width: 100%;
        box-sizing: border-box;
    }

    .button
    {
        display: block;
        margin: 20px auto;
    }

    /* Footer agar flex ya block hai to center */
    footer
    {
        text-align: center;
    }
}

/* =========================
   Mobile
========================= */
@media screen and (max-width: 768px)
{
    .food
    {
        background-position: center;
        background-size: cover;
        height: auto;
        min-height: 400px;
    }

    .ul
    {
        flex-direction: column;
        text-align: center;
        padding-top: 15px;
    }

    .ul #li
    {
        display: block;
        margin: 10px 0;
    }

    .ul #li #a
    {
        margin-left: 0;
        font-size: 18px;
    }

    #chinese
    {
        display: block;
        margin: 0 auto 15px auto;
        max-width: 90%;
    }

    i
    {
        margin-left: 0;
        margin-top: 10px;
    }

    #h1
    {
        text-align: center;
        font-size: 30px;
        padding-top: 120px;
        padding-bottom: 120px;
        padding-left: 15px;
        padding-right: 15px;
    }

    .color
    {
        height: auto;
        padding: 30px 0;
    }

    .contact
    {
        width: 95%;
        height: auto;
        border-radius: 15px;
    }

    .contact1
    {
        padding: 20px;
        text-align: center;
    }

    #p1,
    #p2,
    #p3,
    #p4
    {
        font-size: 18px;
    }

    #input
    {
        width: 100%;
        height: 45px;
        box-sizing: border-box;
    }

    .input1
    {
        width: 100%;
        height: 180px;
        box-sizing: border-box;
    }

    .button
    {
        display: block;
        margin: 20px auto;
        width: 100%;
        max-width: 250px;
    }

    footer
    {
        text-align: center;
    }
}

    </style>
</head>
<body>

  <div class="food">
         <nav>
       <ul class="ul">
       <img id="chinese" src="logo.webp" alt="">
         <li id="li"><a id="a" href="index.html">Home</a></li>
         <li id="li"><a id="a" href="menu.html">Our Menu</a></li>
         <li id="li"><a id="a" href="about.html">About Us</a></li>
         <li id="li"><a id="a" href="Testimonials.html">Testimonials</a></li>
         <li id="li"><a id="a" href="contact.html">Contact us</a></li>
         <i class="fa-solid fa-magnifying-glass"></i>
       </ul> 

       <div class="hamburger" onclick="toggleMenu()">
         <i class="fa-solid fa-bars"></i>
       </div>

    </nav>
    <hr>
    <h1 id="h1">Contact Us</h1>
    </div>

    <div class="color">
        <div class="contact">
           <div class="contact1">
           <p id="p1">Your Name</p>
            <input id="input" type="text">

            <p id="p2">Your Emai</p>
            <input id="input" type="text">

            <p id="p3">Subject</p>
            <input id="input" type="text">

            <p id="p4">Your message (optional)</p>
            <textarea class="input1" name="" id=""></textarea>

          <a id="a2" href="#"><button class="button">Submit</button></a> 
            
           </div>
        </div>
    </div>
    


    <script>
function toggleMenu()
{
    document.querySelector(".ul").classList.toggle("active");
}
</script>


</body>
</html>
